          sprite: _Misfits/Mobs/Species/Fat/displacement.rsi
          state: hand
          copyToShaderParameters:
            layerKey: dummy
            parameterTexture: displacementMap
            parameterUV: displacementUV
      jumpsuit:
        layer:
          sprite: _Misfits/Mobs/Species/Fat/displacement.rsi
          state: jumpsuit
          copyToShaderParameters:
            layerKey: dummy
            parameterTexture: displacementMap
            parameterUV: displacementUV
      outerClothing:
        layer:
          sprite: _Misfits/Mobs/Species/Fat/displacement.rsi
          state: outerClothing
          copyToShaderParameters:
